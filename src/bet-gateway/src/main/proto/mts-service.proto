syntax = "proto3";
option go_package = "mts-service";
package protobuf;

option java_package = "protobuf";
option java_multiple_files = true;

// The Betting service definition.
service Mts {
  rpc SubmitBet(MTSTicket) returns (MtsGeneralAck) {}
  rpc SubmitBetCancel(BetCancelRequest) returns (MtsGeneralAck) {}
  rpc SubmitCashout(MTSCashoutRequest) returns (MTSCashoutResponse) {}
}

message MTSBet {
  string stake = 1;
  string betType = 7;
  repeated MTSSelection selections = 8;
}

message MTSTicket {
  int64 profileID = 1;
  int64 betSource = 2;
  string ipAddress = 3;
  string betID = 4;
  string returnChannel = 5;
  repeated MTSBet bets = 6;
}

message MTSSelection {
  enum SelectionType {
    UF = 0;     // normal selection
    WAYS = 1;   // ways selection (nested UF)
    SYSTEM = 2; // system selection (nested UF/WAYS)
  }

  SelectionType type = 1;

  // UF fields (only used when type == UF)
  int64 sportID = 2;
  int64 producerID = 3;
  int64 matchID = 4;
  int64 marketID = 5;
  string specifier = 6;
  string outcomeID = 7;
  float odds = 8;

  // Nested selections (WAYS and SYSTEM)
  repeated MTSSelection selections = 9;

  // SYSTEM sizes (multi-system supported): e.g. [3] or [1,2,4]
  repeated int64 size = 10;
}


message MtsGeneralAck {
  string description = 1;
}

message BetCancelRequest {
  string betID = 1;
  int64 code = 2;
  string signature = 3;
}

// Cashout request
message MTSCashoutRequest {
  string betID = 1;
  int64  profileID = 2;
  int64  betSource = 3;
  string ipAddress = 4;

  // Flow control
  bool   is_build       = 5;   // true = cashout-build, false = cashout-placement

  // Optional: how much to cash out
  // For build, these can be 0 and ignored (MTS will propose).
  double requested_payout   = 6;
  double requested_percent  = 7; // 1.0 = full stake, 0.5 = half stake, etc. for partial
  string signature = 8;
}

// Cashout response
message MTSCashoutResponse {
  string betID = 1;

  // build vs placement so Go knows what this response refers to
  bool   is_build   = 2;

  // Overall result
  bool   success    = 3;
  string status     = 4;
  string reason     = 5;

  // Suggested cashout (main quote MTS gives)
  double payout      = 6;

  // "Fair" payout suggestion
  double fair_payout = 7;

  // Max cashout allowed
  double max_payout  = 8;
  string signature = 9;
  string cashout_type = 10;
  string cashout_id   = 11;
}